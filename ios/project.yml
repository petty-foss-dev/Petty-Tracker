name: EnveKeep
options:
  bundleIdPrefix: com.enve
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  EnveKeep:
    type: application
    platform: iOS
    sources:
      - path: EnveKeep
      - path: Shared
    dependencies:
      - package: ZIPFoundation
      - target: EnveKeepShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enve.keep
        PRODUCT_NAME: EnveKeep
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: EnveKeep/EnveKeep.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.enve.keep
    info:
      path: EnveKeep/Info.plist
      properties:
        CFBundleDisplayName: "petty: Tracker"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take photos of receipts, products and documents to keep with your records.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: false

  EnveKeepShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enve.keep.share
        PRODUCT_NAME: EnveKeepShare
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.enve.keep
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "Save to petty: Tracker"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image").@count > 0).@count > 0

  EnveKeepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EnveKeepTests
    dependencies:
      - target: EnveKeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enve.keep.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EnveKeep.app/EnveKeep
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  EnveKeep:
    build:
      targets:
        EnveKeep: all
        EnveKeepTests: [test]
    test:
      targets:
        - EnveKeepTests
