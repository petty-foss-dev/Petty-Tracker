name: Feature request
description: Suggest an improvement to petty: Tracker.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe a concrete situation or workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe how you would like the app to work.
    validations:
      required: true
