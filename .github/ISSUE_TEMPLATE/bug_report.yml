name: Bug report
description: Report a problem with Enve Keep for iOS.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please use fictional or redacted records. Do not upload personal receipts, document numbers, or payment details."
  - type: input
    id: environment
    attributes:
      label: Device and iOS version
      placeholder: "iPhone 15, iOS 18.6; app commit or version if known"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the screen and actions that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Add redacted screenshots or error text if useful.
    validations:
      required: true
